<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35"/>
      <stop offset="100%" style="stop-color:#FF8C5A"/>
    </linearGradient>
  </defs>
  
  <!-- Main "JEFFY" text -->
  <text x="10" y="42" font-family="Arial Black, Arial, sans-serif" font-size="40" font-weight="900" fill="url(#brandGradient)">
    JEFFY
  </text>
  
  <!-- Speech bubble with exclamation -->
  <ellipse cx="155" cy="25" rx="18" ry="14" fill="#FF6B35"/>
  <polygon points="145,35 150,28 155,35" fill="#FF6B35"/>
  <text x="148" y="30" font-family="Arial Black, Arial, sans-serif" font-size="16" font-weight="900" fill="white">!</text>
  
  <!-- Underline accent -->
  <rect x="10" y="48" width="120" height="4" rx="2" fill="url(#brandGradient)"/>
</svg>
